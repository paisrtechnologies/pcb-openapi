      parameters:
        - name: transaction_id
          in: path
          description: The ID of the transaction to cancel.
          required: true
          schema:
            type: string
            pattern: "^tra_.*$"
      requestBody:
        description: An optional note explaining the reason for cancellation.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCancelTransferRequest"
      responses:
        "200":
          description: Successfully canceled transfer.
