  /wallets/{wallet_id}/transactions:
    get:
      tags:
        - Transactions
      operationId: listWalletTransactions
      summary: List transactions
      description: Returns a paginated list of transactions for the wallet. Use the `balance_id`, `status`, `type`, and `method` filters to narrow results. Each transaction type (inbound, outbound, e-commerce) returns a different shape — see the response schema for details.
      parameters:
        - name: wallet_id
          in: path
          description: The ID of the wallet to retrieve transactions for.
          required: true
          schema:
            type: string
            pattern: "^(buw_|inw_).*"
        - name: balance_id
          in: query
          description: The ID of the balance you want to filter based on.
          required: false
          schema:
            type: string
            pattern: "^(ica_|bca_).*"
        - name: status
          in: query
          description: The status of the transactions you want to filter based on.
          required: false
          schema:
            type: string
            enum:
              - processing
              - settled
              - requires-approval
              - declined
              - failed
              - cancelled
        - name: type
          in: query
          description: The type of the transactions you want to filter based on.
          required: false
          schema:
            type: string
            enum:
              - debit
              - credit
        - name: method
          in: query
          description: The method of the transactions you want to filter based on.
          required: false
          schema:
            type: string
            enum:
              - P2P
              - A2A
              - TopUp
              - Payout
              - EcomPay
        - name: limit
          in: query
          description: The maximum number of transactions to return.
          required: false
          schema:
            $ref: "#/components/schemas/LimitFilter"
        - name: start_date
          in: query
          description: The start date for the transaction range (inclusive).
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
        - name: end_date
          in: query
          description: The end date for the transaction range (inclusive).
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
      responses:
        "200":
          description: Successfully retrieved the list of wallet transactions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          oneOf:
                            - $ref: "#/components/schemas/WalletOutboundTransaction"
                            - $ref: "#/components/schemas/WalletInboundTransaction"
                            - $ref: "#/components/schemas/WalletPayTransaction"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /wallets/{wallet_id}/transactions/{transaction_id}:
    get:
      tags:
