      description: Returns the details of a specific connected bank account, including its verification status.
      parameters:
        - name: wallet_id
          in: path
          description: The ID of the wallet to retrieve the account for.
          required: true
          schema:
            type: string
            pattern: "^(buw_|inw_).*"
        - name: account_id
          in: path
          description: The ID of the account to retrieve.
          required: true
          schema:
            type: string
            pattern: "^cwa_.*$"
      responses:
        "200":
          description: Successfully retrieved wallet account details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/WalletAccount"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    patch:
      tags:
        - Accounts
      operationId: verifyWalletAccount
      summary: Verify a bank account
      description: Confirms ownership of a connected bank account using the 6-digit verification code sent via micro-deposit.
      parameters:
