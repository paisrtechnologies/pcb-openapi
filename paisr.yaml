openapi: 3.1.2
info:
  title: Paisr API
  version: 2.7.0
  description: Paisr is the payment infrastructure for the Caribbean.
  contact:
    name: Customer Support
    email: support@paisr.tech
    url: https://paisr.tech/contact
  termsOfService: https://paisr.tech/legal/terms-of-service
externalDocs:
  url: https://docs.paisr.tech
servers:
  - url: https://api.live.paisr.tech/{version}
    description: Live Server
    variables:
      version:
        default: v2
        enum:
          - v2
        description: Live API version
  - url: https://api.staging.paisr.tech/{version}
    description: Staging Server
    variables:
      version:
        default: v2
        enum:
          - v2
        description: Staging API version
security:
  - bearerAuth: []
tags:
  - name: Tokens
    description: >
      Access tokens authenticate your API requests. Each token carries a set of permission scopes that determine which resources it can read or write. Create tokens with limited scope and expiry to follow the principle of least privilege.
  - name: Webhooks
    description: >
      Webhooks let you subscribe to events that occur in your Paisr account.
      When an event fires, Paisr sends an HTTP POST to your endpoint with an
      HMAC-SHA256 signed payload. Each webhook can subscribe to one or more
      event triggers and can be paused, tested, and monitored independently.
  - name: Wallets
    description: >
      Wallets are the primary financial container in Paisr. Each wallet holds
      one or more currency balances, supports peer-to-peer and bank transfers, and can be configured with a PIN, and public profile.
  - name: Balances
    description: >
      Balances represent a currency-denominated store of funds within a wallet. A wallet can hold multiple balances, one per currency, each backed by a treasurer account at a partner bank.
  - name: Accounts
    description: >
      Connected accounts are verified bank accounts linked to a wallet. Once
      ownership is confirmed via micro-deposit verification, an account can be used as a destination for outbound bank transfers.
  - name: Contacts
    description: >
      Contacts are saved wallet addresses other Paisr users you transact with
      regularly. Adding a contact by cashtag lets you reference them by ID
      when initiating peer transfers.
  - name: Statements
    description: >
      Statements are monthly summaries of wallet activity. Once generated, a
      statement PDF can be downloaded for record-keeping, reconciliation, or
      compliance purposes.
  - name: Transactions
    description: >
      Transactions record every movement of funds into or out of a wallet.
      They are immutable once settled and include a full quote breakdown of fees, taxes, and any currency conversion applied.
  - name: Transfers
    description: >
      Transfers move funds between balances, wallets, or bank accounts. P2P and ACH transfers start in a pending-approval state and require a cryptographic signature from the source wallet before funds are released.
  - name: Invoices
    description: >
      Invoices are payment requests issued to a customer. Each invoice tracks its own line items, voucher discounts, due date, and payment status. Once sent, a customer can pay via a hosted checkout session.
  - name: Subscriptions
    description: >
      Subscriptions automate recurring billing against a plan. Each subscription ties a customer and payment method to one or more plan options, generating invoices automatically at each billing interval.
  - name: Customers
    description: >
      Customers represent the people or businesses you bill. Storing a customer lets you attach billing and shipping details, a default currency, and gives them access to a self-service billing portal.
  - name: Vouchers
    description: >
      Vouchers are discount codes applied to eligible invoices at checkout. You control the maximum number of redemptions, and the expiry date.
  - name: Plans
    description: >
      Plans define the pricing structure of your subscriptions. Each plan holds one or more price options with combinations of unit price, billing interval, and an optional attributes.
  - name: Payments
    description: >
      Payments capture the movement of funds through a supported payment
      method to your wallet. Each payment moves through a lifecycle from initiated to approved to settled.
  - name: Provider Connections
    description: >
      Provider connections link your account to third-party payment processors. External connections store the credentials needed to route payments through that provider.
  - name: Static Pages
    description: >
      Static pages are payment pages that can be used to accept payments without attaching them to an invoice.
  - name: Analytics
    description: >
      Metrics give you a real-time snapshot of invoice, subscription, payment, and customer activity. Use these endpoints to power dashboards or monitor the health of your billing operations.
  - name: Logs
    description: >
      The API log records every request made against your account, including the authentication method, route, response status, and body. Use it to debug integrations or audit API activity.

paths:
  /access-tokens:
    get:
      tags:
        - Tokens
      operationId: listAccessTokens
      summary: List access tokens
      responses:
        "200":
          description: Successfully retrieved the list of access tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      tokens:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccessToken"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    post:
      tags:
        - Tokens
      operationId: createAccessToken
      summary: Create an access token
      requestBody:
        description: Request body for creating an access token.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAccessTokenRequest"
      responses:
        "200":
          description: Successfully created token. Store the secret — it will not be shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /access-tokens/{token_id}:
    get:
      tags:
        - Tokens
      operationId: getAccessToken
      summary: Retrieve an access token
      description: Returns the details of an existing access token, including its scopes and expiry.
      parameters:
        - name: token_id
          in: path
          description: The ID of the API access token.
          required: true
          schema:
            type: string
            pattern: "^tkn_{32}"
      responses:
        "200":
          description: Successfully retrieved access token details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AccessToken"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    put:
      tags:
        - Tokens
      operationId: updateAccessToken
      summary: Update an access token
      description: Updates the description of an existing access token.
      parameters:
        - name: token_id
          in: path
          description: The ID of the token to update.
          required: true
          schema:
            type: string
            pattern: "^tkn_.*$"
      requestBody:
        description: The new description to apply to the token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAccessTokenRequest"
      responses:
        "200":
          description: Successfully updated token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    delete:
      tags:
        - Tokens
      operationId: revokeAccessToken
      summary: Revoke an access token
      description: Permanently revokes a token. Revoked tokens are rejected immediately on the next request. This action cannot be undone.
      parameters:
        - name: token_id
          in: path
          description: The ID of the API access token to revoke.
          required: true
          schema:
            type: string
            pattern: "^tkn_.*$"
      responses:
        "200":
          description: Successfully revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /access-tokens/{token_id}/permissions:
    post:
      tags:
        - Tokens
      operationId: addTokenPermission
      summary: Add a permission
      description: Grants one or more additional permission scopes to an existing token.
      parameters:
        - name: token_id
          in: path
          description: The ID of the API access token to add permissions to.
          required: true
          schema:
            type: string
            pattern: "^tkn_.*$"
      requestBody:
        description: The scopes to add to the token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAccessTokenPermissionRequest"
      responses:
        "200":
          description: Successfully added permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /access-tokens/{token_id}/permissions/{permission_id}:
    delete:
      tags:
        - Tokens
      operationId: removeTokenPermission
      summary: Remove a permission
      description: Revokes a specific permission scope from a token. The token remains active with its remaining scopes.
      parameters:
        - name: token_id
          in: path
          description: The ID of the API access token to remove permissions from.
          required: true
          schema:
            type: string
            pattern: "^tkn_.*$"
        - name: permission_id
          in: path
          description: The ID of the permission to remove.
          required: true
          schema:
            type: string
            pattern: "^tpm_.*$"
      responses:
        "200":
          description: Successfully removed permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /webhooks:
    get:
      tags:
        - Webhooks
      operationId: listWebhooks
      summary: List webhooks
      description: Returns a list of all webhooks configured on your account, including each webhook's endpoint URL, active triggers, and pause status.
      responses:
        "200":
          description: Successfully retrieved the list of profile webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      webhooks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Webhook"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    post:
      tags:
        - Webhooks
      operationId: createWebhook
      summary: Create a webhook
      description: Creates a new webhook endpoint. Paisr will sign all event payloads delivered to your endpoint using HMAC-SHA256. Retrieve the signing secret using the Retrieve webhook secret endpoint after creation — it is not included in this response.
      requestBody:
        description: The endpoint URL and event triggers to subscribe to.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWebhookRequest"
      responses:
        "200":
          description: Successfully created webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /webhooks/{webhook_id}:
    get:
      tags:
        - Webhooks
      operationId: getWebhook
      summary: Retrieve a webhook
      description: Returns the details of a specific webhook, including its endpoint, triggers, and pause status.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to retrieve.
          required: true
          schema:
            type: string
            description: The Webhook ID.
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully retrieved webhook details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Webhook"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    put:
      tags:
        - Webhooks
      operationId: updateWebhook
      summary: Update a webhook
      description: Updates the endpoint URL or description of an existing webhook.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to update.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      requestBody:
        description: The fields to update on the webhook.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutWebhookRequest"
      responses:
        "200":
          description: Successfully updated webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    delete:
      tags:
        - Webhooks
      operationId: deleteWebhook
      summary: Delete a webhook
      description: Permanently deletes the webhook and all its associated triggers. Any events already queued for delivery will not be retried. This action cannot be undone.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to delete.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully removed webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /webhooks/{webhook_id}/test:
    post:
      tags:
        - Webhooks
      operationId: testWebhook
      summary: Send a test event
      description: Sends a synthetic test payload to the webhook endpoint. Use this to confirm your endpoint is reachable and correctly validating the HMAC-SHA256 signature before going live.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to test.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully triggered test event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /webhooks/{webhook_id}/pause:
    post:
      tags:
        - Webhooks
      operationId: pauseWebhook
      summary: Pause a webhook
      description: Pauses event delivery for the webhook. Events that fire while a webhook is paused are not queued — they are silently dropped.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to pause.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully paused webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /webhooks/{webhook_id}/resume:
    post:
      tags:
        - Webhooks
      operationId: resumeWebhook
      summary: Resume a webhook
      description: Resumes event delivery for a paused webhook. Only future events will be delivered; events that fired during the paused period are not replayed.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to resume.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully resumed webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /webhooks/{webhook_id}/stats:
    get:
      tags:
        - Webhooks
      operationId: getWebhookStats
      summary: Retrieve webhook stats
      description: Returns delivery performance metrics for the webhook, including counts of successful, failed, and pending events.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to retrieve stats for.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully retrieved webhook stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/WebhookStats"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /webhooks/{webhook_id}/secret:
    get:
      tags:
        - Webhooks
      operationId: getWebhookSecret
      summary: Retrieve the webhook secret
      description: Returns the current HMAC-SHA256 signing secret for the webhook. Use this secret to verify that incoming payloads originate from Paisr.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to retrieve the secret for.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully retrieved webhook secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/WebhookSecret"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    patch:
      tags:
        - Webhooks
      operationId: rotateWebhookSecret
      summary: Rotate the webhook secret
      description: Generates a new signing secret for the webhook. Paisr begins signing payloads with the new secret immediately, so update your endpoint before rotating to avoid rejected deliveries.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to rotate the secret for.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully rotated webhook secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /webhooks/{webhook_id}/triggers:
    post:
      tags:
        - Webhooks
      operationId: addWebhookTrigger
      summary: Add a trigger
      description: Subscribes a webhook to one or more additional event types.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to add a trigger for.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      requestBody:
        description: The event types to subscribe the webhook to.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWebhookTriggerRequest"
      responses:
        "200":
          description: Successfully added permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /webhooks/{webhook_id}/triggers/{trigger_id}:
    delete:
      tags:
        - Webhooks
      operationId: removeWebhookTrigger
      summary: Remove a trigger
      description: Unsubscribes a webhook from a specific event type. The webhook continues delivering events for its remaining triggers.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to remove the trigger for.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
        - name: trigger_id
          in: path
          description: The ID of the trigger to remove.
          required: true
          schema:
            type: string
            pattern: "^wtr_.*$"
      responses:
        "200":
          description: Successfully removed trigger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /webhooks/{webhook_id}/events:
    get:
      tags:
        - Webhooks
      operationId: listWebhookEvents
      summary: List webhook events
      description: Returns a list of event delivery attempts for the webhook, including status, retry count, and timestamps.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to list events for.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
      responses:
        "200":
          description: Successfully retrieved the list of webhook events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookEvent"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /webhooks/{webhook_id}/events/{event_id}:
    post:
      tags:
        - Webhooks
      operationId: retryWebhookEvent
      summary: Retry a webhook event
      description: Triggers an immediate redelivery attempt for a failed webhook event. Only events where `can_retry` is `true` can be retried.
      parameters:
        - name: webhook_id
          in: path
          description: The ID of the webhook to retry the event for.
          required: true
          schema:
            type: string
            pattern: "^whk_.*$"
        - name: event_id
          in: path
          description: The ID of the event to retry.
          required: true
          schema:
            type: string
            pattern: "^wev_.*$"
      responses:
        "200":
          description: Successfully processed event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /wallets:
    get:
      tags:
        - Wallets
      operationId: listWallets
      summary: List wallets
      description: Returns a list of all wallets on your account, including their balances, profile, and usage limits.
      responses:
        "200":
          description: Successfully retrieved the list of wallets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      wallets:
                        type: array
                        items:
                          $ref: "#/components/schemas/Wallet"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    post:
      tags:
        - Wallets
      operationId: createWallet
      summary: Create a wallet
      description: Creates a new wallet. Once created, open one or more balances to start holding and moving funds.
      requestBody:
        description: The title and icon for the new wallet.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostWalletRequest"
      responses:
        "200":
          description: Successfully created wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /wallets/{wallet_id}:
    get:
      tags:
        - Wallets
      operationId: getWallet
      summary: Retrieve a wallet
      description: Returns the details of a specific wallet, including its profile, PIN status, and current usage.
      parameters:
        - name: wallet_id
          in: path
          description: The ID of the wallet to retrieve.
          required: true
          schema:
            type: string
            pattern: "^(buw_|inw_).*"
      responses:
        "200":
          description: Successfully retrieved wallet details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Wallet"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    delete:
      tags:
        - Wallets
      operationId: deleteWallet
      summary: Delete a wallet
      description: Permanently deletes a wallet. All associated balances must be closed and at zero before deletion. This action cannot be undone.
      parameters:
        - name: wallet_id
          in: path
          description: The ID of the wallet to delete.
          required: true
          schema:
            type: string
            pattern: "^(buw_|inw_).*"
      responses:
        "200":
          description: Successfully removed wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
