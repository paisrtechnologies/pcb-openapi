              fee_volume:
                type: number
              tax_volume:
                type: number

    # Request Schemas
    PostAccessTokenRequest:
      type: object
      description: Post access token request schema.
      required:
        - description
        - scopes
      properties:
        description:
          type: string
          description: Clear description on the token use case.
          example: Postman
          pattern: ^[a-zA-Z0-9() ]{4,48}$
        scopes:
          type: array
          description: List scopes to attach to the token.
          example:
            - invoices.read
            - invoices.write
          minItems: 1
          items:
            type: string
    PutAccessTokenRequest:
      type: object
      description: Put access token request schema.
      required:
        - description
      properties:
        description:
          type: string
          description: Clear description on the token use case.
          example: Postman
          pattern: ^[a-zA-Z0-9() ]{4,48}$
    PostAccessTokenPermissionRequest:
      type: object
      description: Post access token permission request schema.
      required:
        - scopes
      properties:
        scopes:
          type: array
          description: List of scopes to attach to the token.
          example:
            - invoices.read
            - invoices.write
          minItems: 1
          items:
            type: string

    # Profile Webhooks
    PostWebhookRequest:
      type: object
      description: Post webhook request schema.
      required:
        - description
        - endpoint
        - events
      properties:
        description:
          type: string
          description: Clear description on the webhook use case.
          example: Checkout Callback
          pattern: ^[a-zA-Z0-9() ]{4,48}$
        endpoint:
          type: string
          format: uri
          description: Full url of the webhook.
          example: https://my-checkout.com/callback
        events:
          type: array
          description: List of events to attach to the webhook.
          example:
            - invoice.paid
          minItems: 1
          items:
            type: string
            example: invoice.paid
    PutWebhookRequest:
      type: object
      description: Put webhook request schema.
      properties:
        description:
          type: string
          description: Clear description on the webhook use case.
          example: Checkout Callback
          pattern: ^[a-zA-Z0-9() ]{4,48}$
        endpoint:
          type: string
          format: uri
          description: Full url of the webhook.
          example: https://my-checkout.com/callback
    PostWebhookTriggerRequest:
      type: object
      description: Post webhook trigger request schema.
      required:
        - events
      properties:
        events:
          type: array
          description: List of events to attach to the webhook.
          example:
            - invoice.paid
          minItems: 1
          items:
            type: string

    # Wallets
    PostWalletRequest:
      type: object
      description: Post wallet request schema.
      properties:
        title:
          type: string
          description: Short title or name for the wallet.
          example: Acme Cash
          pattern: ^[a-zA-Z0-9 ]{6,48}$
        icon:
          $ref: "#/components/schemas/WalletIconType"
    PostWalletProfileRequest:
      type: object
      description: Post wallet profile request schema.
      properties:
        nickname:
          type: string
          description: Short nickname.
          example: Acme Finance
          pattern: ^[a-zA-Z0-9 ]{6,48}$
        cashtag:
          type: string
          description: Unique cashtag used for transfer purposes.
          example: acmefinance
          pattern: ^[a-z0-9]{6,48}$
        public:
          type: boolean
          description: Flag indicating if wallet is discoverable by other users.
          example: true
    PostWalletPinRequest:
      type: object
      description: Post wallet pin request schema.
      required:
        - new_pin
      properties:
        new_pin:
          type: string
          description: The PIN to set.
          example: "1234"
          pattern: ^[0-9]{4}$
        old_pin:
          type: string
          description: The PIN to verify before updating. Required when updating an existing PIN.
          example: "4321"
          pattern: ^[0-9]{4}$

    PostWalletBalanceRequest:
      type: object
      description: Post wallet balance request schema.
      required:
        - title
        - currency
        - type
      properties:
        title:
          type: string
          description: Short title or name for the balance.
          example: SRD Revenue
          pattern: ^[a-zA-Z0-9 ]{6,48}$
        currency:
          $ref: "#/components/schemas/CurrencyType"
        type:
          $ref: "#/components/schemas/WalletBalanceType"
    PutWalletBalanceRequest:
      type: object
      description: Put wallet balance request schema.
      required:
        - title
      properties:
        title:
          type: string
          description: Short title or name for the balance.
          example: SRD Revenue
          pattern: ^[a-zA-Z0-9 ]{6,48}$

    PostWalletAccountRequest:
      type: object
      description: Post wallet account request schema.
      required:
        - account_holder
        - account_number
        - account_type
        - swift_code
        - currency
      properties:
        account_holder:
          type: string
          description: Full account holder name.
        account_number:
          type: string
          description: Full account number / IBAN.
        routing_number:
          type: string
          description: Routing number. Required for US accounts.
        account_type:
          $ref: "#/components/schemas/WalletAccountType"
        swift_code:
          $ref: "#/components/schemas/BankSwiftType"
        currency:
          $ref: "#/components/schemas/CurrencyType"
    PatchWalletAccountRequest:
      type: object
      description: Patch wallet account request schema.
      required:
        - code
      properties:
        code:
          type: string
          description: Six digit verification code.
          example: "123456"
          minLength: 6
          maxLength: 6

    PostWalletContactRequest:
      type: object
      description: Post wallet contact request schema.
      required:
        - cashtag
      properties:
        cashtag:
          type: string
          description: Unique cashtag of the wallet.
          example: acmecorp

    # Transfers
    PostTransferRequest:
      type: object
      description: Post transfer request schema.
      required:
        - method
        - source
        - destination
        - amount
      properties:
        method:
          type: string
          enum:
            - P2P
            - A2A
            - ACH
          description: The payment rail that will be used for the transfer.
          example: P2P
        source:
          type: string
          description: Source balance ID.
          example: ica_<string>
        destination:
          type: string
          description: Depending on the method, this can be a contact ID or cashtag for P2P, a balance ID for A2A, or an account ID for ACH.
          example: acmecorp
        amount:
          type: number
          format: float
          description: Amount to transfer. Must be at least 0.10 for P2P, 0.01 for A2A, or 25.00 for ACH.
          example: 100.00
        reference:
          type: string
          description: Summary about the transfer. This value is required when the method is set to P2P or ACH and omitted when set to A2A.
          example: Order #12345
    PostApproveTransferRequest:
      type: object
      description: Request body for approving a transfer.
      required:
        - signature
      properties:
        signature:
          type: string
          description: Signature of the transfer signed by the source wallet.
          example:
    PostCancelTransferRequest:
      type: object
      description: Request body for cancelling a transfer.
      required:
        - note
      properties:
        note:
          type: string
          description: Reason for cancellation.
          example: Order cancelled by customer

    # Customers
    PostCustomerRequest:
      type: object
      description: Request body for creating a customer.
      required:
        - email
      properties:
        name:
          type: string
          description: The name of the customer.
          example: John Doe
        email:
          type: string
          format: email
          description: The email address of the customer.
          example: john.doe@example.com
        phone:
          type: string
          format: tel
          description: The phone number of the customer. (eg +597-8123456)
          example: +597-8123456
        default_currency:
          $ref: "#/components/schemas/CurrencyType"
        billing_details:
          $ref: "#/components/schemas/CustomerBillingDetails"
        shipping_details:
          $ref: "#/components/schemas/CustomerShippingDetails"
        metadata:
          type: object
          description: Up to 5 custom key-value pair
    PutCustomerRequest:
      type: object
      description: Request body for updating a customer.
      properties:
        name:
          type: string
          description: The name of the customer.
          example: John Doe
        email:
          type: string
          format: email
          description: The email address of the customer.
          example: john.doe@example.com
        phone:
          type: string
          format: tel
          description: The phone number of the customer. (eg +597-8123456)
          example: +597-8123456
        default_currency:
          $ref: "#/components/schemas/CurrencyType"
        billing_details:
          $ref: "#/components/schemas/CustomerBillingDetails"
        shipping_details:
          $ref: "#/components/schemas/CustomerShippingDetails"
        metadata:
          type: object
          description: Up to 5 custom key-value pairs

    # Vouchers
    PostVoucherRequest:
      type: object
      description: Request body for creating a voucher.
      required:
        - description
        - code
        - amount
        - max_redeems
        - expires
      properties:
        description:
          type: string
          description: Short description about the voucher.
          example: Discount voucher for loyal customers.
        code:
          type: string
          description: Unique code that will be shared with customers.
          example: DISCOUNT123
        amount:
          type: number
          format: float
          minimum: 1
          description: Discount amount.
          example: 10.0
        max_redeems:
          type: number
          minimum: 1
          maximum: 1000000
          description: Max number of redeems.
          example: 100
        expires:
          type: string
          description: Expiration date in relative time. (e.g. 'In 3 days')
          example: In 3 days
    PutVoucherRequest:
      type: object
      description: Request body for updating a voucher.
      properties:
        description:
          type: string
          description: Short description about the voucher.
          example: Discount voucher for loyal customers.
        amount:
          type: number
          format: float
          minimum: 1
          description: Discount amount.
          example: 10.0
        max_redeems:
          type: number
          minimum: 1
          maximum: 1000000
          description: Max number of redeems.
          example: 100
        expires:
          type: string
          description: Expiration date in relative time. (e.g. 'In 3 days')
          example: In 3 days
    PostApplyVoucherRequest:
      type: object
      description: Request body for applying a voucher to an invoice.
      required:
        - invoice_id
        - code
      properties:
        invoice_id:
          type: string
          description: ID of the invoice redeeming the voucher.
          example: inv_123
        code:
          type: string
          description: Unique code of the voucher.
          example: DISCOUNT123

    # Plans
    PostPlanRequest:
      type: object
      description: Request body for creating a plan.
      required:
        - title
        - summary
        - currency
      properties:
        title:
          type: string
          description: Short description about the plan
          example: Premium Plan
        summary:
          type: string
          description: A detailed summary explaining what the plan is about.
          example: This plan includes all premium features and access to exclusive content.
        currency:
          $ref: "#/components/schemas/CurrencyType"
        options:
          type: array
          minItems: 1
          maxItems: 10
          description: List of plan line options.
          items:
            $ref: "#/components/schemas/PlanLineOption"
    PutPlanRequest:
      type: object
      description: Request body for updating a plan.
      properties:
        title:
          type: string
          description: Short description about the plan
          example: Premium Plan
        summary:
          type: string
          description: A detailed summary detailing what the plan is about.
          example: This plan includes all premium features and access to exclusive content.
        currency:
          $ref: "#/components/schemas/CurrencyType"
    PostPlanOptionRequest:
      type: object
      description: Request body for creating a plan option.
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/PlanLineOption"
    PutPlanOptionRequest:
      type: object
      description: Request body for updating a plan option.
      properties:
        description:
          type: string
          description: Detailed description about the option.
          example: Option description
        unit_price:
          type: number
          format: float
          minimum: 0.01
          description: Price per unit.
          example: 10.99
        billing_interval:
          type: number
          minimum: 1
          maximum: 365
          description: The number of days for each billing interval. (e.g. 30 for monthly or 365 for yearly)
          example: 30
        attributes:
          type: object
          maxProperties: 16
          description: Custom key-value pairs that can be used for option specific features.
          example: { "key": "value" }

    # Invoices
    PostInvoiceRequest:
      type: object
      description: Request body for creating an invoice.
      required:
        - customer
        - summary
        - due
      properties:
        customer:
          type: string
          description: ID or email address of the customer being billed.
          example: john@example.com
        summary:
          type: string
          description: Detailed description about the invoice.
          example: Invoice for services rendered
        currency:
          $ref: "#/components/schemas/CurrencyType"
        due:
          type: string
          description: Due date in relative time. (e.g. 'In 3 days')
          example: In 3 days
        line_items:
          type: array
          minItems: 0
          maxItems: 50
          description: List of line items for the invoice.
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
    PutInvoiceRequest:
      type: object
      description: Request body for updating an invoice.
      properties:
        summary:
          type: string
          description: Detailed description about the invoice.
          example: Invoice for services rendered
        currency:
          $ref: "#/components/schemas/CurrencyType"
        due:
          type: string
          description: Due date in relative time. (e.g. 'In 3 days')
          example: In 3 days
    PostInvoiceItemRequest:
      type: object
      description: Request body for creating an invoice item.
      required:
        - line_items
      properties:
        line_items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
    PutInvoiceItemRequest:
      type: object
      description: Request body for updating an invoice item.
      properties:
        description:
          type: string
          description: Detailed description about the item.
          example: Invoice item for services rendered
        quantity:
          type: number
          description: Number of units.
          example: 1
        unit_price:
          type: number
          format: float
          description: Price per unit.
          example: 100.00

    # Subscriptions
    PostSubscriptionRequest:
      type: object
      description: Request body for creating a subscription.
      required:
        - customer
        - auto_renew
        - line_items
      properties:
        customer:
          type: string
          description: ID or email address of the customer being billed.
          example: customer@example.com
        auto_renew:
          type: boolean
          description: Flag indicating if the subscription should auto renew the subscription at each billing cycle.
          example: true
        line_items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/SubscriptionLineItem"

    # Payments
    PostPaymentRequest:
      type: object
      description: Request body for creating a payment.
      required:
        - invoice_id
        - payment_method
      properties:
        invoice_id:
          type: string
          description: The ID of the invoice being paid
          pattern: "^inv_.*$"
          example: inv_123
        payment_method:
          type: object
          description: The payment method to be used
          required:
            - type
            - data
          properties:
            type:
              $ref: "#/components/schemas/PaymentSourceType"
            data:
              oneOf:
                - $ref: "#/components/schemas/QrPaymentData"
                - $ref: "#/components/schemas/WalletPaymentData"
                - $ref: "#/components/schemas/CardPaymentData"
                - $ref: "#/components/schemas/BankPaymentData"
        billing_details:
          $ref: "#/components/schemas/PaymentBillingDetails"
    PostRefundPaymentRequest:
      type: object
      description: Request body for refunding a payment.
      required:
        - type
        - note
      properties:
        type:
          type: string
          enum:
            - full
            - partial
          description: Type of refund to perform
          example: full
        amount:
          type: number
          format: float
          description: Amount to refund. Required when type is set to partial.
          example: 100.00
        note:
          type: string
          description: Reason for refund.
          example: Refund for late payment

    # Payment Providers
    PostProviderRequest:
      type: object
      description: Request body for creating a payment provider.
      required:
        - slug
        - type
      properties:
        slug:
          $ref: "#/components/schemas/PaymentProviderType"
        type:
          type: string
          enum:
            - managed
            - custom
          description: Type of provider connection. Managed providers use Paisr's managed infrastructure, while custom providers use your own API credentials.
          example: managed
        attributes:
          type: object
          properties:
            merchant_id:
              type: string
              description: Provider specific Merchant ID.
              example: STORE_ID
            secret_key:
              type: string
              description: Provider specific API credentials.
              example: API_KEY
    PutProviderRequest:
      type: object
      description: Request body for updating a payment provider.
      required:
        - merchant_id
        - secret_key
      properties:
        merchant_id:
          type: string
          description: Provider specific Merchant ID.
          example: STORE_ID
        secret_key:
          type: string
          description: Provider specific API credentials.
          example: API_KEY

    # Static Pages
    PostStaticPageRequest:
      type: object
      description: Request body for creating a static page.
      required:
        - description
        - fields
      properties:
        description:
          type: string
          description: Name of description of the page
          example: Page Description
        fields:
          type: array
          description: Formfields to be visible on the page
          example: []
          items:
            type: string

  responses:
    4XXResponse:
      description: Validation failed or the requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientErrorResponse"
    5XXResponse:
      description: An unexpected error occurred. Contact support if the issue persists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServerErrorResponse"
