        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutInvoiceItemRequest"
      responses:
        "200":
          description: Successfully updated invoice item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    delete:
      tags:
        - Invoices
      operationId: deleteInvoiceItem
      summary: Remove a line item
      description: Removes a line item from an unpaid invoice. The invoice totals are recalculated immediately.
      parameters:
        - name: invoice_id
          in: path
          description: The ID of the invoice that contains the item to delete.
          required: true
          schema:
            type: string
            pattern: "^inv_.*$"
        - name: item_id
          in: path
          description: The ID of the item to delete.
          required: true
          schema:
            type: string
            pattern: "^itm_.*$"
      responses:
        "200":
          description: Successfully removed invoice item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /subscriptions:
    get:
      tags:
        - Subscriptions
      operationId: listSubscriptions
      summary: List subscriptions
      description: Returns a list of subscriptions, optionally filtered by a related resource (customer or payment method), currency, or status.
      parameters:
        - name: resource_id
          in: query
          description: The ID of the resource you want to filter based on. (e.g. Customer or Payment method ID's)
          required: false
          schema:
            type: string
        - name: currency
          in: query
          description: The currency you want to filter based on.
          required: false
          schema:
            type: string
            pattern: ^[A-Z]{3}$
        - name: status
          in: query
          description: The status you want to filter based on.
          required: false
          schema:
            $ref: "#/components/schemas/SubscriptionStatus"
        - name: limit
          in: query
          description: The number of results to return.
          required: false
          schema:
            $ref: "#/components/schemas/LimitFilter"
        - name: start_date
          in: query
          description: The start date to filter based on.
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
        - name: end_date
          in: query
          description: The end date to filter based on.
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
      responses:
        "200":
          description: Successfully retrieved the list of subscriptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      subscriptions:
                        type: array
                        items:
                          $ref: "#/components/schemas/Subscription"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    post:
      tags:
        - Subscriptions
      operationId: createSubscription
      summary: Create a subscription
      description: Creates a new subscription for a customer. The response includes a hosted payment session URL where the customer completes their initial payment method setup.
      requestBody:
        description: The customer, plan options, auto-renewal preference, and optional trial period.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostSubscriptionRequest"
      responses:
        "200":
          description: Successfully created subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDataResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /subscriptions/{subscription_id}:
    get:
      tags:
        - Subscriptions
      operationId: getSubscription
      summary: Retrieve a subscription
      description: Returns the full details of a specific subscription, including its line items, billing schedule, and current status.
      parameters:
        - name: subscription_id
          in: path
          description: The ID of the subscription to retrieve.
          required: true
          schema:
            type: string
            pattern: "^sub_.*$"
      responses:
        "200":
          description: Successfully retrieved subscription details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    default: true
                  data:
                    $ref: "#/components/schemas/SubscriptionDetails"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    patch:
      tags:
        - Subscriptions
      operationId: toggleAutoRenewal
      summary: Toggle auto-renewal
      description: Enables or disables automatic renewal for a subscription. Disabling auto-renewal allows the subscription to expire at the end of the current billing period without generating a new invoice.
      parameters:
        - name: subscription_id
          in: path
          description: The ID of the subscription to toggle auto-renewal for.
          required: true
          schema:
            type: string
            pattern: "^sub_.*$"
      responses:
        "200":
          description: Successfully modified subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    delete:
      tags:
        - Subscriptions
      operationId: deleteSubscription
      summary: Delete a subscription
      description: Permanently deletes a subscription and all its associated data. Active subscriptions should be cancelled before deletion. This action cannot be undone.
      parameters:
        - name: subscription_id
          in: path
          description: The ID of the subscription to delete.
          required: true
          schema:
            type: string
            pattern: "^sub_.*$"
      responses:
        "200":
          description: Successfully removed subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /subscriptions/{subscription_id}/restore:
    post:
      tags:
        - Subscriptions
      operationId: restoreSubscription
      summary: Restore a subscription
      description: Restores a subscription that entered a `suspended` state due to a failed payment. This triggers a new payment attempt using the subscription's current payment method.
      parameters:
        - name: subscription_id
          in: path
          description: The ID of the subscription to restore.
          required: true
          schema:
            type: string
            pattern: "^sub_.*$"
      responses:
        "200":
          description: Successfully restored subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /subscriptions/{subscription_id}/cancel:
    post:
      tags:
        - Subscriptions
      operationId: cancelSubscription
      summary: Cancel a subscription
      description: Cancels an active subscription. The subscription remains accessible until the end of the current billing period, after which no further invoices are generated.
      parameters:
        - name: subscription_id
          in: path
          description: The ID of the subscription to cancel.
          required: true
          schema:
            type: string
            pattern: "^sub_.*$"
      responses:
        "200":
          description: Successfully cancelled subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /payments:
    get:
      tags:
        - Payments
      operationId: listPayments
      summary: List payments
      description: Returns a list of payments, optionally filtered by invoice, currency, status, or payment method.
      parameters:
        - name: resource_id
          in: query
          description: The ID of the resource you want to filter based on (e.g. Invoice).
          required: false
          schema:
            type: string
        - name: currency
          in: query
          description: The currency you want to filter based on.
          required: false
          schema:
            type: string
            pattern: ^[A-Z]{3}$
        - name: status
          in: query
          description: The status you want to filter based on.
          required: false
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: method
          in: query
          description: The method you want to filter based on.
          required: false
          schema:
            $ref: "#/components/schemas/PaymentSourceType"
        - name: limit
          in: query
          description: The number of results to return.
          required: false
          schema:
            $ref: "#/components/schemas/LimitFilter"
        - name: start_date
          in: query
          description: The start date to filter based on.
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
        - name: end_date
          in: query
          description: The end date to filter based on.
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
      responses:
        "200":
          description: Successfully retrieved the list of payments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      payments:
                        type: array
                        items:
                          $ref: "#/components/schemas/Payment"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    post:
      tags:
        - Payments
      operationId: initiatePayment
      summary: Initiate a payment
      description: >-
        Initiates a payment against an existing invoice. The response shape
        varies by method: wallet and bank payments return a redirect session URL,
        card payments are settled synchronously, and QR payments return a
        scannable code with an in-app deep link.
      requestBody:
        description: The invoice ID, payment method details, and billing information.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPaymentRequest"
      responses:
        "200":
          description: Successfully initiated payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /payments/{payment_id}:
    get:
      tags:
        - Payments
      operationId: getPayment
      summary: Retrieve a payment
      description: Returns the full details of a specific payment, including its amount breakdown, billing details, and current lifecycle status.
      parameters:
        - name: payment_id
          in: path
          description: The ID of the payment to retrieve.
          required: true
          schema:
            type: string
            pattern: "^pmt_.*$"
      responses:
        "200":
          description: Successfully retrieved payment details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Payment"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /payments/{payment_id}/refund:
    post:
      tags:
        - Payments
      operationId: refundPayment
      summary: Refund a payment
      description: Issues a full or partial refund against a settled payment. Partial refunds require the `amount` field. The invoice status is updated automatically upon successful refund.
      parameters:
        - name: payment_id
          in: path
          description: The ID of the payment to refund.
          required: true
          schema:
            type: string
            pattern: "^pmt_.*$"
      requestBody:
        description: The refund type (full or partial), optional amount, and optional reason note.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRefundPaymentRequest"
      responses:
        "200":
          description: Successfully refunded payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /providers:
    get:
      tags:
        - Provider Connections
      operationId: listProviders
      summary: List provider connections
      description: Returns a list of all payment provider connections on your account, including their status and supported currencies.
      responses:
        "200":
          description: Successfully retrieved the list of providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items:
                          $ref: "#/components/schemas/PaymentProvider"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    post:
      tags:
        - Provider Connections
      operationId: connectProvider
      summary: Connect a provider
      description: Connects a new payment provider using your provider-specific API credentials. Once connected, the provider becomes available as a payment method for initiating payments.
      requestBody:
        description: The provider slug and API credentials.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostProviderRequest"
      responses:
        "200":
          description: Successfully connected provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /providers/{connection_id}:
    put:
      tags:
        - Provider Connections
      operationId: updateProvider
      summary: Update a connection
      description: Replaces the API credentials stored for a provider connection. Use this when rotating API keys with your payment provider.
      parameters:
        - name: connection_id
          in: path
          description: The ID of the provider connection to update.
          required: true
          schema:
            type: string
            pattern: "^bpc_.*$"
      requestBody:
        description: The updated merchant ID and secret key.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutProviderRequest"
      responses:
        "200":
          description: Successfully updated provider connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    patch:
      tags:
        - Provider Connections
      operationId: toggleProviderConnection
      summary: Enable or disable a connection
      description: Toggles a provider connection between enabled and disabled. Disabled connections cannot be used to process payments.
      parameters:
        - name: connection_id
          in: path
          description: The ID of the provider connection to toggle.
          required: true
          schema:
            type: string
            pattern: "^bpc_.*$"
      responses:
        "200":
          description: Successfully modified provider connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    delete:
      tags:
        - Provider Connections
      operationId: disconnectProvider
      summary: Disconnect a provider
      description: Permanently removes a provider connection. Any payment methods linked to this provider will no longer function. This action cannot be undone.
      parameters:
        - name: connection_id
          in: path
          description: The ID of the provider connection to disconnect.
          required: true
          schema:
            type: string
            pattern: "^bpc_.*$"
      responses:
        "200":
          description: Successfully removed provider connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /pages:
    get:
      tags:
        - Static Pages
      operationId: listStaticPages
      summary: List static pages
      description: Returns a list of all static payment pages on your account, including their session.
      responses:
        "200":
          description: Successfully retrieved the list of pages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      pages:
                        type: array
                        items:
                          $ref: "#/components/schemas/StaticPage"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    post:
      tags:
        - Static Pages
      operationId: createStaticPage
      summary: Create a page
      description: Creates a new static payment page with a 30-day session.
      requestBody:
        description: The page description and fields.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostStaticPageRequest"
      responses:
        "200":
          description: Successfully created page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDataPlainResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /pages/{page_id}:
    put:
      tags:
        - Static Pages
      operationId: updateStaticPage
      summary: Update a page
      description: Update the configuration of a page.
      parameters:
        - name: page_id
          in: path
          description: The ID of the page to update.
          required: true
          schema:
            type: string
            pattern: "^stp_.*$"
      requestBody:
        description: The page description and fields.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostStaticPageRequest"
      responses:
        "200":
          description: Successfully updated page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
    delete:
      tags:
        - Static Pages
      operationId: deleteStaticPage
      summary: Delete a page
      description: Permanently removes a page. This action cannot be undone.
      parameters:
        - name: page_id
          in: path
          description: The ID of the page to delete.
          required: true
          schema:
            type: string
            pattern: "^stp_.*$"
      responses:
        "200":
          description: Successfully removed page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /metrics:
    get:
      tags:
        - Analytics
      operationId: getMetrics
      summary: Retrieve metrics for analytical purposes
      description: Returns the corresponding metrics based on the provided filter
      parameters:
        - name: filter
          in: query
          description: The resource to filter based on
          required: false
          schema:
            type: string
            enum:
              - volume
              - payments
              - customers
              - invoices
              - subscriptions
            example: volume
        - name: start_date
          in: query
          description: The start date for the filter range.
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
        - name: end_date
          in: query
          description: The end date for the filter range.
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
      responses:
        "200":
          description: Successfully retrieved metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/VolumeMetrics"
                      - $ref: "#/components/schemas/CustomerMetrics"
                      - $ref: "#/components/schemas/InvoiceMetrics"
                      - $ref: "#/components/schemas/SubscriptionMetrics"
                      - $ref: "#/components/schemas/PaymentMetrics"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

  /logs:
    get:
      tags:
        - Logs
      operationId: listLogs
      summary: List API logs
      description: Returns a paginated list of API request logs for your account. Logs include the request method, route, authentication flow, response status, and response body. Use the filters to narrow results to a specific resource, HTTP method, or auth flow.
      parameters:
        - name: resource_id
          in: query
          description: Filter logs by a specific resource ID. Defaults to the account profile ID if not provided.
          required: false
          schema:
            type: string
        - name: method
          in: query
          description: The method to filter based on.
          required: false
          schema:
            type: string
            enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
        - name: auth_flow
          in: query
          description: The authentication flow to filter based on.
          required: false
          schema:
            type: string
            enum:
              - token
              - user
        - name: limit
          in: query
          description: The number of logs to return in the response.
          required: false
          schema:
            $ref: "#/components/schemas/LimitFilter"
        - name: start_date
          in: query
          description: The start date for the filter range.
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
        - name: end_date
          in: query
          description: The end date for the filter range.
          required: false
          schema:
            $ref: "#/components/schemas/DateFilter"
      responses:
        "200":
          description: Successfully retrieved the list of logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditLog"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token for authentication.

  schemas:
    # Filters
    DateFilter:
      type: string
      example: 2026-10-01
      description: The date to filter based on
    LimitFilter:
      type: number
      description: The number of results to return in the response.
      minimum: 1
      maximum: 1000

    # States
    SuccessState:
      type: boolean
      example: true
      description: Indicates that the request was successful.
      default: true
    FailureState:
      type: boolean
      example: false
      description: Indicates that the request was unsuccessful.
      default: false

    # Responses
    BaseResponse:
      type: object
      description: Base response schema.
      properties:
        success:
          $ref: "#/components/schemas/SuccessState"
        message:
          type: string
          description: A descriptive message regarding the result.
          example: Request was successful.
    ClientErrorResponse:
      type: object
      description: Client error response schema.
      properties:
        success:
          $ref: "#/components/schemas/FailureState"
        error:
          type: object
          properties:
            type:
              type: string
              description: Matching client error code.
              example: request_error
            message:
              type: string
              description: A detailed error message.
              example: Invalid request body
            data:
              type: object
              default: null
              description: Metadata about the error.
    ServerErrorResponse:
      type: object
      description: Server error response schema.
      properties:
        success:
          $ref: "#/components/schemas/FailureState"
        error:
          type: object
          properties:
            type:
              type: string
              description: Matching server error code.
              example: server_error
            message:
              type: string
              description: A detailed error message.
              example: Something went wrong on our end.
            data:
              type: object
              default: null
              description: Metadata about the error.
    DataResponse:
      type: object
      description: Data response schema.
      properties:
        success:
          $ref: "#/components/schemas/SuccessState"
        data:
          type: object
          example: { "id": "tkn_123" }
          properties:
            id:
              type: string
              description: The unique identifier of the newly created resource.
    SessionDataResponse:
      type: object
      description: Data response schema for session data.
      properties:
        success:
          $ref: "#/components/schemas/SuccessState"
        data:
          type: object
          properties:
            id:
              type: string
              description: The unique identifier of the newly created resource.
              example: inv_123
            status:
              type: string
              description: The status of the newly created resource.
              example: draft
            session:
              $ref: "#/components/schemas/SessionData"
    SessionDataPlainResponse:
      type: object
      description: Data response schema for session data in plain format.
      properties:
        success:
          $ref: "#/components/schemas/SuccessState"
        data:
          type: object
          properties:
            id:
              type: string
              description: The unique identifier of the newly created resource.
              example: inv_123
            session:
              $ref: "#/components/schemas/SessionData"
    TokenResponse:
      type: object
      description: Data response schema for token data.
      properties:
        success:
