    # Data Schemas
    SessionData:
      type: object
      description: The session details for collecting payment
      properties:
        url:
          type: string
          description: The checkout url
        expires_at:
          type: string
          description: Session expiration time.
          format: date-time
    QrPaymentData:
      type: object
      required:
        - provider
      description: The details required for a QR payment
      properties:
        provider:
          type: string
          description: The slug of the QR code provider
    BankPaymentData:
      type: object
      required:
        - swift_code
      description: The details required for a bank payment
      properties:
        swift_code:
          $ref: "#/components/schemas/BankSwiftType"
        redirect_url:
          type: string
          description: The url to redirect the customer to after completing their payment
    WalletPaymentData:
      type: object
      required:
        - provider
      description: The details required for a wallet payment
      properties:
        provider:
          type: string
          description: The slug of the wallet provider
        redirect_url:
          type: string
          description: The url to redirect the customer to after completing their payment
    CardPaymentData:
      type: object
      required:
        - holder_name
        - number
        - expiry
        - cvc
      description: The details required for a card payment
      properties:
        holder_name:
          type: string
          description: The full name of the card holder
        number:
          type: string
          description: The 16-19 digit card number
        cvc:
          type: string
          description: The 3-4 digit CVC or PIN
        expiry:
          type: object
          required:
            - month
            - year
          description: The expiration details
          properties:
            month:
              type: string
              description: Expiration month
              lenght: 2
            year:
              type: string
              description: Expiration year
              lenght: 2
    NextActionRedirect:
      type: object
