  /transfers:
    post:
      tags:
        - Transfers
      operationId: initiateTransfer
      summary: Initiate a transfer
      description: Initiates a transfer using the specified method. All transfers start in a `pending-approval` state and require a cryptographic signature from the source wallet before funds are released. Use the Approve transfer endpoint to complete the flow, or Cancel transfer to abort it.
      requestBody:
        description: The source, destination, amount, and optional reference for the transfer.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostTransferRequest"
      responses:
        "200":
          description: Successfully initiated transfer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
  /transfers/{transaction_id}/approve:
    post:
      tags:
        - Transfers
      operationId: approveTransfer
      summary: Approve a transfer
      description: Approves a pending transfer by submitting a cryptographic signature generated by the source wallet. Once approved, the transfer is processed and funds are debited from the source balance. This action is irreversible.
      parameters:
        - name: transaction_id
          in: path
          description: The ID of the transaction to approve.
          required: true
          schema:
            type: string
            pattern: "^tra_.*$"
      requestBody:
        description: The wallet signature authorizing this transfer.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostApproveTransferRequest"
      responses:
        "200":
          description: Successfully approved transfer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResponse"
        "4XX":
          $ref: "#/components/responses/4XXResponse"
        "5XX":
          $ref: "#/components/responses/5XXResponse"
