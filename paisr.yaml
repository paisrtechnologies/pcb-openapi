                  data:
                    oneOf:
                      - $ref: "#/components/schemas/WalletOutboundTransaction"
                      - $ref: "#/components/schemas/WalletInboundTransaction"
                      - $ref: "#/components/schemas/WalletPayTransaction"
        "4XX":
